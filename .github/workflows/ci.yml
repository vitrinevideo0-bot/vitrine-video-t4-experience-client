name: Contrats, audio, Worker et moteur T4

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Installer les dépendances verrouillées
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          npm ci --prefix cloudflare

      - name: Compiler et tester les contrats T4 complets
        run: |
          python -m compileall -q adapter audio/scripts engine tools tests
          pytest -q
          python tools/build_t4_cloudflare_contracts.py --check
          (cd audio/voice/t4-voice-v1 && sha256sum -c SHA256SUMS.txt)
          (cd audio/music/t4-afrobeat-v1 && sha256sum -c SHA256SUMS.txt)

      - name: Prouver la reproductibilité du contrat des 12 écrans
        run: |
          python tools/build_t4_capture_flow.py --output /tmp/T4_CAPTURE_FLOW_V1_0_0.json
          cmp config/T4_CAPTURE_FLOW_V1_0_0.json /tmp/T4_CAPTURE_FLOW_V1_0_0.json

      - name: Prouver la timeline des trois signatures hybrides
        run: |
          python tools/build_t4_transition_contract.py --output /tmp/T4_TRANSITIONS_HYBRIDES_30S_V3.json
          cmp reverse-engineering/T4_TRANSITIONS_HYBRIDES_30S_V3.json /tmp/T4_TRANSITIONS_HYBRIDES_30S_V3.json

      - name: Prouver la reproductibilité des 12 maquettes PNG
        run: |
          rm -rf /tmp/t4-ui-screens
          python tools/generate_t4_ui_screens.py --output-dir /tmp/t4-ui-screens
          diff -qr ui-screens /tmp/t4-ui-screens

      - name: Compiler et empaqueter le Worker Cloudflare sans le déployer
        working-directory: cloudflare
        run: npm test

      - name: Tester le plan de contrôle Cloudflare, R2 et la rotation transactionnelle
        working-directory: cloudflare
        run: |
          set -euo pipefail
          rm -rf /tmp/t4-wrangler-ci
          python test/mock_github_api.py --port 8791 > /tmp/t4-mock-github.log 2>&1 &
          MOCK_PID=$!
          npx wrangler dev --local --ip 127.0.0.1 --port 8788 --persist-to /tmp/t4-wrangler-ci \
            --var CLIENT_API_TOKEN:test-client \
            --var CALLBACK_TOKEN:test-callback \
            --var GITHUB_TOKEN:test-github \
            --var GITHUB_API_BASE:http://127.0.0.1:8791 \
            --var PUBLIC_API_BASE:http://127.0.0.1:8788 \
            > /tmp/t4-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          cleanup() { kill "$WRANGLER_PID" "$MOCK_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(120):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('Wrangler did not become ready')
          PY
          python test/control_plane_integration.py --base http://127.0.0.1:8788
