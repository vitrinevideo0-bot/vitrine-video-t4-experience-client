name: Rendu silencieux T4 sur GitHub

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publier le candidat silencieux dans une pré-Release immuable
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: t4-silent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout T4
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer FFmpeg et les dépendances verrouillées
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Compiler, tester et reconstruire les contrats
        run: |
          python -m compileall -q engine tools tests
          python -m unittest discover -s tests -v
          python tools/build_t4_capture_flow.py --output /tmp/T4_CAPTURE_FLOW_V1_0_0.json
          cmp config/T4_CAPTURE_FLOW_V1_0_0.json /tmp/T4_CAPTURE_FLOW_V1_0_0.json
          python tools/build_t4_transition_contract.py --output /tmp/T4_TRANSITIONS_30S.json
          cmp reverse-engineering/T4_TRANSITIONS_30S.json /tmp/T4_TRANSITIONS_30S.json
          rm -rf /tmp/t4-ui-screens
          python tools/generate_t4_ui_screens.py --output-dir /tmp/t4-ui-screens
          diff -qr ui-screens /tmp/t4-ui-screens

      - name: Télécharger et vérifier les quatre rushes réels
        run: |
          python tools/fetch_rushes.py \
            --manifest rushes/manifest.json \
            --cache rushes/cache

      - name: Produire le candidat silencieux sur le runner GitHub
        run: |
          python engine/render_silent.py \
            --manifest rushes/manifest.json \
            --contract reverse-engineering/T4_TRANSITIONS_30S.json \
            --render-job demo/render_job_silent_demo.json \
            --cache rushes/cache \
            --work .tmp/t4-silent \
            --output-dir output/t4-silent-v1.0.0

      - name: Valider indépendamment format, durée, images, audio et transitions
        run: |
          python tools/validate_silent.py \
            --output-dir output/t4-silent-v1.0.0 \
            --proof output/t4-silent-v1.0.0/T4_GITHUB_SERVER_VALIDATION.json

      - name: Assembler la livraison sans rush brut
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release
          cp output/t4-silent-v1.0.0/VIDEO_T4_EXPERIENCE_CLIENT_SILENCIEUSE_V1_A_VALIDER.mp4 release/
          cp output/t4-silent-v1.0.0/T4_SILENT_RENDER_REPORT.json release/
          cp output/t4-silent-v1.0.0/T4_GITHUB_SERVER_VALIDATION.json release/
          cp output/t4-silent-v1.0.0/RAPPORT_RENDU_SILENCIEUX.md release/
          cp output/t4-silent-v1.0.0/T4_TRANSITION_PROOF_V1.jpg release/
          cp reverse-engineering/T4_TRANSITIONS_30S.json release/
          cp config/T4_CREATIVE_CONTRACT_V1_0_0.json release/
          cp config/T4_CAPTURE_FLOW_V1_0_0.json release/
          cp config/T4_EXPERIENCE_CLIENT_TEMPLATE_V1_0_0.json release/
          cp form/questions_T4.json release/
          cp capture-guide/consignes_T4.json release/
          cp demo/render_job_silent_demo.json release/T4_RENDER_JOB_DEMO.json
          cp rushes/manifest.json release/T4_RUSHES_MANIFEST.json
          cp ui-screens/manifest.json release/T4_UI_12_SCREENS_MANIFEST.json
          cp ui-screens/T4_PLANCHE_12_ECRANS.png release/
          cp docs/LICENCES_RUSHS.md release/
          cp docs/CONTRAT_12_ECRANS.md release/
          cp docs/TRANSITIONS_A_B_C_D.md release/
          if find release -maxdepth 1 -type f \( -name 'S1_*.mp4' -o -name 'S2_*.mp4' -o -name 'S3_*.mp4' -o -name 'S4_*.mp4' \) | grep -q .; then
            echo 'Rush brut interdit dans la livraison' >&2
            exit 1
          fi
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Publier l’artefact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: T4-silent-candidate-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Préparer les notes de pré-Release
        if: inputs.publish_prerelease
        run: |
          cat > /tmp/t4-release-notes.md <<'EOF'
          # RESTAURATION-T4 — candidat silencieux Expérience client v1

          Candidat produit exclusivement sur GitHub Actions à partir du commit indiqué par la Release.

          - 30,000 secondes ;
          - 720 × 1280, 30 i/s, 900 images ;
          - H.264 / yuv420p ;
          - zéro piste audio et aucun texte incrusté ;
          - quatre scènes 6/8/7/9 s ;
          - fusion propriétaire A+B+C+D appliquée par 48 événements déterministes ;
          - mosaïques, grilles multi-plans, impacts brefs, blocs média et micro-glitchs de 1 à 3 images ;
          - protection de la dégustation et 90 dernières images de S4 sans effet ;
          - aucun séparateur bleu/cyan ni barre de couleur unie ;
          - quatre rushes Pexels vérifiés par SHA-256, jamais redistribués bruts ;
          - questions, contrat des douze écrans, planche UI, rapports et preuves inclus.

          **Statut humain : à valider.** Cette pré-Release ne signifie pas que le propriétaire a approuvé le rendu créatif. Aucune musique ni voix off n’est incluse.
          EOF

      - name: Publier une pré-Release additive et immuable
        if: inputs.publish_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="t4-experience-client-v1.0.0-silent-candidate-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release $TAG existe déjà : refus de l’écraser." >&2
            exit 1
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "T4 Expérience client — candidat silencieux v1 #${GITHUB_RUN_NUMBER}" \
            --notes-file /tmp/t4-release-notes.md \
            --prerelease
